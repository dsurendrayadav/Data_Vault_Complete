# --- Connection settings ---
listen_addresses = '*'
port = 5432

# --- Replication settings ---
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
wal_keep_size = 256MB

# --- pg_stat_statements (query stats for the dashboard) ---
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 1000
pg_stat_statements.track = all

# --- Logging (optional but useful while learning) ---
log_min_duration_statement = 200
